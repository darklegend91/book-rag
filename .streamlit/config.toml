# Server deployment. The app has no per-user separation: anyone who can reach it
# can upload books, read generated papers and use the LLM server. It therefore
# REFUSES to start on a network address unless BOOKRAG_APP_PASSWORD is set in
# .env — set one before exposing this.
#
# For local-only use instead, set address = "127.0.0.1" (no password needed).
[server]
address = "0.0.0.0"
port = 8501
headless = true
# A long-running server does not edit its own source; watching costs CPU and
# file handles.
fileWatcherType = "none"
# MB per file. Streamlit holds uploads in memory and accepts them from any open
# session, even before sign-in, so keep this near your largest book. Cloudflare's
# free plan rejects requests over 100 MB regardless.
maxUploadSize = 200
# Uploads and question papers travel over this connection; keep it behind TLS.
enableXsrfProtection = true

[client]
# Visitors see a generic error instead of a traceback with file paths and code;
# the full traceback still goes to the server log.
showErrorDetails = "none"
# No Deploy button, rerun or settings menu for visitors.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
