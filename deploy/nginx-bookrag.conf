# Reverse proxy with TLS. Streamlit speaks plain HTTP and needs websockets;
# the app's password is sent as form data, so TLS is not optional.
#
# This file goes in sites-enabled/, which nginx includes inside http {}, so the
# zone definitions below are valid here.

# Streamlit accepts file uploads from any open browser session -- signed in or
# not -- and keeps them in memory, so uploads are rate-limited per client.
limit_req_zone  $binary_remote_addr zone=bookrag_upload:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=bookrag_conn:10m;

server {
    listen 443 ssl http2;
    server_name books.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # No framing by other sites (clickjacking), and no images from other origins:
    # a second guard, after the app's own, against an answer that embeds an
    # attacker's image URL to leak the question.
    add_header Content-Security-Policy "frame-ancestors 'self'; img-src 'self' data: blob:" always;

    # Keep in step with server.maxUploadSize in .streamlit/config.toml.
    client_max_body_size 200M;
    limit_conn bookrag_conn 20;

    location /_stcore/upload_file/ {
        limit_req zone=bookrag_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The app's sign-in lockout keys on this; it only trusts it from a local proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Index builds and paper generation are long; don't cut them off.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}

server {
    listen 80;
    server_name books.example.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
