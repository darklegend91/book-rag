name: tests

on:
  push:
  pull_request:

# The tests only read the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU torch wheels: the tests never load encoder weights or call a model.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
      - name: Compile
        run: python -m compileall -q app.py bookrag
      - name: Fix regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit regression tests
        run: python -m unittest discover -s audit -p 'test_audit.py' -v
      # Fails the build when a pinned dependency has a published vulnerability.
      - name: Known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
